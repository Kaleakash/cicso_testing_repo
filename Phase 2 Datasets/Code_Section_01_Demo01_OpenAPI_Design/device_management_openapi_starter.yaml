openapi: 3.0.3
info:
  title: Device Management API
  version: 1.0.0
  description: OpenAPI contract for the NetPulse Device Management API.
paths:
  /devices:
    get:
      summary: Get all devices
      responses:
        '200':
          description: Successful response
    post:
      summary: Create a device
      responses:
        '201':
          description: Device created
  /devices/{device_id}:
    get:
      summary: Get one device
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Device found
        '404':
          description: Device not found
